name: Backend CI

on:
  push:
    paths: 
      - "backend/**"
    branches: [ $default-branch ]
  pull_request:
    paths: 
      - "backend/**"
    branches: [ $default-branch ]

  jobs: 
    build:
      runs-on: ubuntu-latest

      defaults:
        run:
          working-directory: backend
      steps:
        - uses: actions/checkout@v4
        
        - name: Use Node
          uses: actions/setup-node@v4
          with: 
            node-version: 24.13.0
            - run: npm ci
        - run: npm run build --if-present
        - run: npm start
        - run: npm test