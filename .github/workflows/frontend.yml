name: Frontend CI

on:
  pull_request:
    paths: 
      - "frontend/**"

jobs: 
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node
        uses: actions/setup-node@v4
        with: 
          node-version: 20
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test